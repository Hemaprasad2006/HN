services:
  db:
    image: postgres:15-alpine
    container_name: lifeos-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lifeos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lifeos-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/lifeos?schema=public"
      JWT_SECRET: "lifeos_super_secret_jwt_sign_key_123!"
    depends_on:
      - db

volumes:
  pgdata:
